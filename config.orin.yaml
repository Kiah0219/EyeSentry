# Jetson Orin + RealSense。启动：python main.py -c config.orin.yaml
# 相机之外的配置与 config.yaml 相同；只换相机时改上面的 source 即可。
camera:
  # RealSense 会暴露多个节点，认准彩色那个；不要强制 MJPG（会出绿帧）
  source: /dev/video4
  width: 1280
  height: 720
  fps: 15
  fourcc: YUYV

server:
  host: 0.0.0.0
  port: 8000

stream:
  jpeg_quality: 80

detector:
  # python | none；二期插入 C++ 侧车时改为 cpp（见 PRD 7.8）
  backend: python
  model: models/yolov8n.pt
  conf: 0.4
  imgsz: 640
  # COCO 类别编号白名单；留空表示全部类别
  # 0 人 / 15 猫 / 24 背包 / 39 瓶子 / 41 杯子 / 56 椅子 / 63 笔记本 / 67 手机 / 73 书 / 74 时钟
  classes: [0, 15, 24, 39, 41, 56, 63, 67, 73, 74]

dwell:
  # 同一跟踪 ID 连续存在多久算一次停留
  seconds: 5.0
  # 触发后多久内不重复播报；冷却按跟踪 ID 记
  # 这个值在 ABO1 的 Orbbec 画面上放大到 120；RealSense 上 30 秒即可
  cooldown_seconds: 30
  # 目标短暂消失多久仍视为连续（抵抗单帧漏检）
  lost_tolerance_seconds: 2.0

tts:
  engine: edge
  voice: zh-CN-XiaoxiaoNeural
  # 可用变量：{n} 人数、{dwell} 阈值秒数
  template: "检测到{n}人停留超过{dwell}秒"
  # 播报通道：device（本体喇叭，默认）/ web（浏览器）/ mute（静音）
  channel: device
  # auto 跟随系统默认输出；JetPack 没有 ffplay 时自动回退 gst-launch-1.0
  sink: auto
  volume: 0.6
