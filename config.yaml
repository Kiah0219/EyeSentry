camera:
  # Linux: 填设备路径，如 /dev/video4；macOS / Windows: 填序号，如 0
  # 不确定填什么就先跑：python tools/check_camera.py
  source: 0
  width: 1280
  height: 720
  fps: 15
  fourcc: MJPG

server:
  host: 0.0.0.0
  port: 8000

stream:
  jpeg_quality: 80

detector:
  # python | none；二期插入 C++ 侧车时改为 cpp（见 PRD 7.8）
  backend: python
  model: models/yolov8n.pt
  conf: 0.4
  imgsz: 640
  # COCO 类别编号白名单；留空表示全部类别
  # 0 人 / 15 猫 / 24 背包 / 39 瓶子 / 41 杯子 / 56 椅子 / 63 笔记本 / 67 手机 / 73 书 / 74 时钟
  classes: [0, 15, 24, 39, 41, 56, 63, 67, 73, 74]
